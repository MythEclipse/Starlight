plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.10.437' apply false
    id 'architectury-plugin' version '3.4.162'
    id 'maven-publish'
}

ext {
    minecraft_version = '1.20.1'
    yarn_mappings = '1.20.1+build.10'
    loader_version = '0.15.1'
    mod_version = '1.1.3'
    maven_group = 'ca.spottedleaf.starlight'
    archives_base_name = 'starlight'
}

architectury {
    minecraft = project.ext.minecraft_version
}

def getGitCommit = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "starlight-${project.name}-mc${rootProject.ext.minecraft_version}"
    }

    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.ext.minecraft_version}"
        mappings loom.officialMojangMappings()

        compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
        annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(AbstractArchiveTask) {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

allprojects {
    group = rootProject.ext.maven_group
    version = rootProject.ext.mod_version + "+mc" + rootProject.ext.minecraft_version + "." + getGitCommit()
}
